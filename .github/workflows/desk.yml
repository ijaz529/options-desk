# The desk's heartbeat, on GitHub's clock.
#
# Sessions (all times UTC; US market 13:30–20:00):
#   steward  13:45 Mon–Fri  — the income round, once the open has settled
#   hunter   14:15, 18:30   — Claude reads the tape twice a session
#   sweep    every 30 min in-session — mechanical exits, both sleeves
#   sweep    hourly at weekends — the crypto sleeve never sleeps
#   collar   14:37 Mon–Fri    — The Harbour's one daily session, on its own account
name: desk
on:
  schedule:
    # ODD MINUTES ON PURPOSE. Measured on this account 28-29 Aug: GitHub delivered
    # ~11% of scheduled slots landing on :00/:15/:30/:45, delayed 7-38 min when it
    # did — those are the platform's busiest minutes and `schedule` is best-effort.
    # Critical sessions therefore get SEVERAL chances; every session is idempotent
    # (steward and weekend skip names already held or working; hunter skips if it
    # has already traded today; sweep and derisk close what is open), so a double
    # fire costs nothing and a dropped slot costs a retry instead of the session.
    #
    # steward — the income round, once the open has settled (13:30 UTC).
    # Five slots, not three: on Mon 31 Aug all three morning slots were dropped
    # and the session first ran at 19:40 — sessions are idempotent, so slots are
    # retries for a best-effort scheduler, not extra sessions.
    - cron: '47 13 * * 1-5'
    - cron: '58 13 * * 1-5'
    - cron: '11 14 * * 1-5'
    - cron: '31 14 * * 1-5'
    - cron: '53 14 * * 1-5'
    # hunter — twice a session, Claude reading a fresh tape; the 90-minute
    # cooldown makes extra slots retries, never a doubled position
    - cron: '19 14 * * 1-5'
    - cron: '29 14 * * 1-5'
    - cron: '7 15 * * 1-5'
    - cron: '21 15 * * 1-5'
    - cron: '33 18 * * 1-5'
    - cron: '43 18 * * 1-5'
    # sweep — mechanical exits, roughly every 20 minutes in session
    - cron: '3,23,43 14-19 * * 1-5'
    # weekend — the crypto sleeve decides Saturday, exits run hourly all weekend
    - cron: '13 10 * * 6'
    - cron: '27 10 * * 6'
    - cron: '7 * * * 0,6'
    # The Harbour (team 2, `collar`) — one session a day is enough: buy the lot, then the
    # collar, then nothing until quarter-end. Three slots are retries; the session holds
    # if an order is working or the collar is already on (scheduled 5 Oct 2026).
    - cron: '37 14 * * 1-5'
    - cron: '17 16 * * 1-5'
    - cron: '49 18 * * 1-5'
    # de-risk — the contest's last session. Three chances: this one cannot be missed.
  workflow_dispatch:
    inputs:
      session:
        description: 'which session to run (collar = The Harbour, condor = The Tollgate)'
        type: choice
        default: status
        options: [status, steward, hunter, sweep, weekend, derisk, collar, condor]

# the desk commits its own decision log — the default token is read-only
permissions:
  contents: write

concurrency:
  group: desk
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      # the official Alpaca CLI — the heartbeat's read door (structured JSON,
      # env auth, paper by default; hackathon requirement made real)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
      - run: go install github.com/alpacahq/cli/cmd/alpaca@v0.0.14 && echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # uv provides uvx, which runs Alpaca's official MCP server for the Hunter
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: pick the session for this slot
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cmd=${{ inputs.session }}" >> "$GITHUB_OUTPUT"
            # Teams 2 and 3 run their one session on their OWN account and keys
            # (STRATEGY.md "How teams are kept apart"); everything else is the Wheelhouse.
            case "${{ inputs.session }}" in
              collar|condor) echo "team=${{ inputs.session }}" >> "$GITHUB_OUTPUT" ;;
              *) echo "team=wheelhouse" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "team=wheelhouse" >> "$GITHUB_OUTPUT"
            case "${{ github.event.schedule }}" in
              '37 14 * * 1-5'|'17 16 * * 1-5'|'49 18 * * 1-5')
                echo "cmd=collar" >> "$GITHUB_OUTPUT"; echo "team=collar" >> "$GITHUB_OUTPUT" ;;
              '47 13 * * 1-5'|'58 13 * * 1-5'|'11 14 * * 1-5'|'31 14 * * 1-5'|'53 14 * * 1-5')
                echo "cmd=steward" >> "$GITHUB_OUTPUT" ;;
              '19 14 * * 1-5'|'29 14 * * 1-5'|'7 15 * * 1-5'|'21 15 * * 1-5'|'33 18 * * 1-5'|'43 18 * * 1-5')
                echo "cmd=hunter" >> "$GITHUB_OUTPUT" ;;
              '13 10 * * 6'|'27 10 * * 6')
                echo "cmd=weekend" >> "$GITHUB_OUTPUT" ;;
              *) echo "cmd=sweep" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - run: python -m desk.run ${{ steps.pick.outputs.cmd }}
        env:
          DESK_TEAM: ${{ steps.pick.outputs.team }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          # one key pair per team; a team with no keys refuses and writes that down
          ALPACA_API_KEY_ID_COLLAR: ${{ secrets.ALPACA_API_KEY_ID_COLLAR }}
          ALPACA_API_SECRET_KEY_COLLAR: ${{ secrets.ALPACA_API_SECRET_KEY_COLLAR }}
          ALPACA_API_KEY_ID_CONDOR: ${{ secrets.ALPACA_API_KEY_ID_CONDOR }}
          ALPACA_API_SECRET_KEY_CONDOR: ${{ secrets.ALPACA_API_SECRET_KEY_CONDOR }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # the decision log is the product — persist it on every run
      - run: python -m desk.writeup   # the one-pager regenerates with every session
        if: steps.pick.outputs.team == 'wheelhouse'   # it is the Wheelhouse's write-up
      - name: commit the decision log
        if: always()   # a crashed session's partial diary is still a diary
        run: |
          git config user.name "the-desk" && git config user.email "desk@users.noreply.github.com"
          # decisions.jsonl merges by union (.gitattributes); WRITEUP.md and
          # decisions.md are DERIVED — on a race, take the other side and
          # re-render, never fail the push: a lost diary row is the one defect
          # this project cannot afford (Thu 3 Sep: three hunter buys vanished
          # in rebase races and their stops referenced entries never logged).
          git add logs/ docs/WRITEUP.md && git diff --cached --quiet || git commit -m "log: ${{ steps.pick.outputs.cmd }} session"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            git checkout --theirs docs/WRITEUP.md logs/decisions.md 2>/dev/null || true
            git add docs/WRITEUP.md logs/decisions.md 2>/dev/null || true
            GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep $((i*5)); }
          done
